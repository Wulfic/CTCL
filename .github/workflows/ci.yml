# CI for the band branches (Stage 9, decisions.md 2026-09-24).
#
# plan    - tools/release.py: band, base version, the other pinned versions, range label, next version,
#           and whether conventional commits since the band's last tag call for a release.
# build   - on the base version: unit tests, server and client gametests, the uninstall check, and
#           (multi-version bands) the production gametests. Uploads the release jar.
# verify  - (multi-version bands) one job per other pinned version: the release jar must be byte-identical
#           to that version's compile, the full suite runs recompiled, and the production gametests run
#           the release jar itself on that version.
# release - on a push, when plan says so: tag v<version>+<label>, publish the GitHub release, then delete
#           the band's older tags and releases (keep 1, owner's choice).
name: CI

on:
  push:
    branches: ['band/**']
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - '.claude/**'
      - '.github/skills/**'
      - '.github/copilot-instructions.md'
      - 'Logo/**'
  pull_request:
    branches: ['band/**']
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - '.claude/**'
      - '.github/skills/**'
      - '.github/copilot-instructions.md'
      - 'Logo/**'
  workflow_dispatch:

# One run per branch at a time, so each release plans against the tags the previous run created.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # setup-java's JDKs, so Gradle's toolchains (21 on 1.21.11, 25 on 26.x) resolve without downloads.
  GRADLE_FLAGS: --console=plain --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      band: ${{ steps.plan.outputs.band }}
      base: ${{ steps.plan.outputs.base }}
      others: ${{ steps.plan.outputs.others }}
      multi: ${{ steps.plan.outputs.multi }}
      label: ${{ steps.plan.outputs.label }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - id: plan
        name: Plan the version
        env:
          # A PR is planned against the band it targets.
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 tools/release.py plan --branch "$BRANCH"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LABEL: ${{ needs.plan.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      # Loom wraps client runs in xvfb-run on CI. On 26.3 the OpenGL backend finds no GLX visual there, so the
      # client falls back to Vulkan, which needs Mesa's lavapipe (as in Fabric API's own CI). A client that can open
      # no backend hangs rather than exits, hence the step timeouts.
      - name: xvfb and Mesa Vulkan for the client gametests
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Build, unit tests, server gametests
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" build
      - name: Client gametest (xvfb)
        timeout-minutes: 20
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" runClientGameTest
      - name: Uninstall check (vanilla server loads the gametest world)
        run: python3 tools/uninstall_check.py
      - name: Production gametests with the release jar
        if: needs.plan.outputs.multi == 'true'
        timeout-minutes: 30
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" prodServerGameTest prodClientGameTest
      - name: Collect the release jar
        run: |
          mkdir -p release-jars
          cp "build/libs/ctcl-$VERSION+$LABEL.jar" release-jars/
          if [ "${{ needs.plan.outputs.multi }}" = true ]; then
            cp "build/libs/ctcl-$VERSION+$LABEL-gametest.jar" release-jars/
          fi
          ls -l release-jars
      - uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: release-jars/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ needs.plan.outputs.base }}
          path: |
            build/run/*/logs/
            build/run/*/*/logs/
            build/reports/
          if-no-files-found: ignore

  verify:
    needs: [plan, build]
    if: needs.plan.outputs.multi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.plan.outputs.others) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MC: ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      # Mesa Vulkan and step timeouts: see the build job.
      - name: xvfb and Mesa Vulkan for the client gametests
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: release-jars
      - name: Release jar is byte-identical to this version's compile
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" -Pminecraft_version="$MC" -Pctcl_prod_mods=release-jars checkReleaseJarBytes
      - name: Full suite, recompiled for this version
        timeout-minutes: 30
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" -Pminecraft_version="$MC" build runClientGameTest
      - name: Uninstall check
        run: python3 tools/uninstall_check.py --minecraft "$MC"
      - name: Production gametests running the release jar on this version
        timeout-minutes: 30
        run: ./gradlew $GRADLE_FLAGS -Pmod_version="$VERSION" -Pminecraft_version="$MC" -Pctcl_prod_mods=release-jars prodServerGameTest prodClientGameTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.minecraft }}
          path: |
            build/run/*/logs/
            build/run/*/*/logs/
            build/reports/
          if-no-files-found: ignore

  release:
    needs: [plan, build, verify]
    # verify is skipped on single-version bands; anything else must have succeeded.
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.plan.outputs.release == 'true'
      && needs.build.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      LABEL: ${{ needs.plan.outputs.label }}
      BAND: ${{ needs.plan.outputs.band }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: release-jars
      - name: Release notes
        run: |
          {
            echo "CTCL $VERSION for Minecraft $LABEL. Built from ${GITHUB_SHA}."
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              git log --no-merges --format='- %s' "$PREVIOUS_TAG..$GITHUB_SHA"
            else
              echo "First release of this band."
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Tag and publish
        run: >-
          python3 tools/release.py publish --version "$VERSION" --label "$LABEL"
          --jar "release-jars/ctcl-$VERSION+$LABEL.jar" --sha "$GITHUB_SHA" --notes-file release-notes.md
      - name: Delete the band's older tags and releases (keep the newest)
        run: python3 tools/release.py cleanup --band "$BAND" --keep "v$VERSION+$LABEL" --force

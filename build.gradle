plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ctcl" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		// src/gametest: a separate test mod; `build` runs its server gametests headless.
		createSourceSet = true
		modId = "ctcl-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
		// Client gametests only: Loom 1.17.21 never clears the server gametest world (see gotchas.md).
		clearRunDirectory = true
	}
}

configurations {
	// Mockito's inline mock maker, attached as an agent (JDK 21+ warns on self-attach).
	mockitoAgent
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	testImplementation "org.mockito:mockito-junit-jupiter:${project.mockito_version}"
	// Runs tests under Fabric's Knot classloader so Minecraft classes can be bootstrapped.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	mockitoAgent("org.mockito:mockito-core:${project.mockito_version}") {
		transitive = false
	}
}

test {
	useJUnitPlatform()
	def agent = configurations.mockitoAgent
	jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile}"] } as CommandLineArgumentProvider)
	// The agent appends to the boot classpath, which disables CDS and makes the JVM warn about it.
	jvmArgs "-Xshare:off"
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:all', '-Werror']
}

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ is not fully compatible with the configuration cache: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric — stable releases only (see .agent/memory/decisions.md).
# Versions from meta.fabricmc.net and FabricMC/fabric-example-mod branches 26.1 – 26.3.
# This band builds one jar per Minecraft version from the same source, and each jar declares
# ~<minecraft_version>. Build another version with -Pminecraft_version=<mc> (see TESTING.md).
minecraft_version=26.1
loader_version=0.19.5
loom_version=1.17.21
# The Mixin annotations common/ compiles against: the version loader_version ships (its fabric-installer.json).
sponge_mixin_version=0.17.4+mixin.0.8.7

# Fabric API has a separate release line per Minecraft version. The build fails for a version
# with no pin here; -Pfabric_api_version=<v> overrides it. Release jars are 26.1, 26.2 and 26.3;
# the 26.1 jar covers 26.1.x, and the patch pins exist so every patch can be tested.
fabric_api.26.1=0.145.1+26.1
fabric_api.26.1.1=0.145.4+26.1.1
fabric_api.26.1.2=0.155.3+26.1.2
fabric_api.26.2=0.161.0+26.2
fabric_api.26.3=0.161.0+26.3

# Quilt loads the Fabric jar (TODO Stage 12). Stable Quilt Loader only (no -beta), one pin per Minecraft
# version it runs; the production gametests use it with -Pctcl_loader=quilt. The jar is named -Fabric-Quilt only
# when every fabric_api pin has a Quilt pin. Quilt provides an older fabricloader than loader_version:
# checkQuiltFloor keeps fabric.mod.json's floor at or below it.
quilt_loader.26.1=0.30.1
quilt_loader.26.1.1=0.30.1
quilt_loader.26.1.2=0.30.1
quilt_loader.26.2=0.30.1
quilt_loader.26.3=0.30.1
quilt_installer_version=0.15.1

# NeoForge (TODO Stages 13, 16). One pin per Minecraft version: the stable build (no -beta), or the latest beta only
# where there is no stable build (owner answer 27): 26.1, 26.1.1, and 26.3 are beta-only. A beta pin moves to stable
# once one ships. neoforge.mods.toml accepts each pin and newer, up to the next pinned version (gradle/pins.gradle).
moddev_version=2.0.148
neoforge.26.1=26.1.0.19-beta
neoforge.26.1.1=26.1.1.15-beta
neoforge.26.1.2=26.1.2.112
neoforge.26.2=26.2.0.88
neoforge.26.3=26.3.0.39-beta

# Forge (TODO Stages 14, 16). Forge builds carry no suffix, so stable means a -recommended promotion (promotions_slim.json).
# One pin per Minecraft version: the recommended build, or -latest only where there is none (owner answer 27): 26.1,
# 26.1.1, and 26.3 have none. mods.toml accepts each pin up to its next major; each Minecraft version has its own major.
forgegradle_version=7.0.40
# FML treats each output dir as its own mod file, so ForgeGradle puts a source set's classes and resources in one dir
# (the MDK's setting). Only ForgeGradle reads it, so it changes forge/ alone.
net.minecraftforge.gradle.merge-source-sets=true
forge.26.1=62.0.9
forge.26.1.1=63.0.2
forge.26.1.2=64.1.0
forge.26.2=65.1.0
forge.26.3=66.0.9
# The Minecraft versions whose Forge pin is a -latest build, because they have no recommended build (owner answer 30).
# NeoForge needs no list: its -beta suffix is the mark. CI's plan job runs tools/check_pins.py, which fails if a pin
# breaks answer 27 or this list disagrees with Forge's promotions.
forge_beta_versions=26.1,26.1.1,26.3

# Test — JUnit stays on 5.x: fabric-loader-junit is built against the JUnit 5 platform.
junit_version=5.14.4
mockito_version=5.24.0

# Mod
mod_version=1.0.0
maven_group=net.wulfnet.ctcl
archives_base_name=ctcl
